<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menjelajah Sistem Pencernaan Manusia — Game Spin Wheel</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 620px at 10% -12%, #1d4ed8 0%, transparent 58%),
      radial-gradient(820px 600px at 92% 6%, #7c3aed 0%, transparent 55%),
      radial-gradient(700px 600px at 50% 110%, #0e7490 0%, transparent 60%),
      linear-gradient(160deg,#0b1220 0%,#0f172a 50%,#020617 100%);
    background-attachment:fixed;
    color:#e2e8f0;
    padding:18px 14px 46px;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1220px;margin:0 auto}

  /* ================= HEADER ================= */
  header{text-align:center;margin-bottom:20px;position:relative}
  .pill{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:2px;
    padding:5px 14px;border-radius:999px;margin-bottom:12px;
    background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18));
    border:1px solid rgba(34,211,238,.45);color:#67e8f9;text-transform:uppercase;
  }
  h1{
    font-size:clamp(19px,3.5vw,40px);
    font-weight:900;letter-spacing:1.2px;margin:0 0 8px;line-height:1.15;
    text-transform:uppercase;
    background:linear-gradient(90deg,#22d3ee 0%,#a78bfa 35%,#f472b6 65%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 22px rgba(34,211,238,.30));
  }
  .author{
    margin:0;font-size:clamp(12px,1.6vw,15px);color:#94a3b8;letter-spacing:.4px;
  }
  .author b{color:#e2e8f0;font-weight:700}

  /* ================= LAYOUT ================= */
  main{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:26px;align-items:start;
  }
  @media(max-width:920px){ main{grid-template-columns:1fr;gap:20px} }

  /* ================= WHEEL ================= */
  .wheel-panel{display:flex;flex-direction:column;align-items:center;gap:14px}
  .wheel-wrap{
    position:relative;width:100%;max-width:520px;aspect-ratio:1/1;
    filter:drop-shadow(0 22px 46px rgba(0,0,0,.60));
  }
  canvas{width:100%;height:100%;display:block;border-radius:50%}
  .pointer{
    position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    width:0;height:0;z-index:5;
    border-left:17px solid transparent;border-right:17px solid transparent;
    border-top:40px solid #fbbf24;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(251,191,36,.8));
  }
  .pointer::after{
    content:"";position:absolute;left:-9px;top:-24px;width:18px;height:18px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#fef3c7,#f59e0b);
    box-shadow:0 0 12px rgba(251,191,36,.9);
  }
  .spin-btn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:27%;aspect-ratio:1/1;border-radius:50%;z-index:4;
    background:radial-gradient(circle at 34% 28%,#fef3c7,#fbbf24 45%,#f59e0b 70%,#b45309 100%);
    border:5px solid rgba(255,255,255,.92);
    font-family:inherit;font-weight:900;letter-spacing:1px;
    font-size:clamp(12px,2.3vw,21px);color:#3b1d00;cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,.55), inset 0 -5px 12px rgba(146,64,14,.45);
    transition:transform .16s ease, box-shadow .16s ease;
    display:grid;place-items:center;line-height:1;
  }
  .spin-btn span{display:block;transform:translateY(1px)}
  .spin-btn:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.07)}
  .spin-btn:active:not(:disabled){transform:translate(-50%,-50%) scale(.96)}
  .spin-btn:disabled{filter:grayscale(.55) brightness(.85);cursor:not-allowed}
  .hint{
    margin:0;font-size:13px;color:#94a3b8;text-align:center;letter-spacing:.3px;
  }
  .hint b{color:#67e8f9}

  /* ================= CARD / PANEL ================= */
  .card{
    background:linear-gradient(160deg,rgba(15,23,42,.86),rgba(2,6,23,.80));
    border:1px solid rgba(148,163,184,.22);
    border-radius:24px;padding:22px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    min-height:430px;position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6,#fbbf24);
    opacity:.9;
  }

  /* ---------- MENU VIEW ---------- */
  .menu-view{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:10px;min-height:390px;
  }
  .menu-icon{font-size:58px;line-height:1;filter:drop-shadow(0 8px 20px rgba(34,211,238,.45));animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .menu-view h2{margin:6px 0 0;font-size:24px;font-weight:800;color:#f1f5f9}
  .menu-view p.muted{margin:0;color:#94a3b8;font-size:14px;line-height:1.6;max-width:400px}
  .tips{
    list-style:none;padding:0;margin:14px 0 6px;text-align:left;
    display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;
  }
  .tips li{
    font-size:13.5px;color:#cbd5e1;background:rgba(148,163,184,.09);
    border:1px solid rgba(148,163,184,.16);border-radius:12px;padding:9px 13px;
  }
  .tips b{color:#67e8f9}
  .stats-row{display:flex;gap:10px;margin:8px 0 4px;flex-wrap:wrap;justify-content:center}
  .stat{
    background:rgba(148,163,184,.10);border:1px solid rgba(148,163,184,.2);
    border-radius:12px;padding:8px 16px;font-size:13px;font-weight:700;color:#cbd5e1;
  }
  .stat.ok{color:#86efac;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.10)}
  .stat.no{color:#fca5a5;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.10)}

  /* ---------- SPINNING VIEW ---------- */
  .spinning-view{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;min-height:390px;text-align:center;
  }
  .spinning-view h2{margin:0;font-size:20px;color:#e2e8f0}
  .loader{
    width:70px;height:70px;border-radius:50%;
    border:7px solid rgba(148,163,184,.20);border-top-color:#22d3ee;border-right-color:#a78bfa;
    animation:spinAnim .9s linear infinite;
    box-shadow:0 0 30px rgba(34,211,238,.35);
  }
  @keyframes spinAnim{to{transform:rotate(360deg)}}

  /* ---------- QUESTION VIEW ---------- */
  .q-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .badge{
    background:linear-gradient(135deg,#22d3ee,#3b82f6);
    color:#04121f;font-weight:900;font-size:13px;letter-spacing:.6px;
    padding:7px 15px;border-radius:999px;box-shadow:0 6px 16px rgba(34,211,238,.35);
  }
  .score-chip{
    font-size:12.5px;font-weight:700;color:#cbd5e1;
    background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.22);
    padding:6px 13px;border-radius:999px;
  }
  .illus{
    background:linear-gradient(135deg,rgba(56,189,248,.10),rgba(167,139,250,.13));
    border:1px solid rgba(148,163,184,.20);border-radius:18px;
    padding:8px;margin-bottom:16px;display:grid;place-items:center;
    animation:popIn .35s ease;
  }
  .illus svg{width:100%;max-width:250px;height:auto;display:block}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .q-text{
    font-size:clamp(15px,1.9vw,18px);line-height:1.55;font-weight:700;
    color:#f1f5f9;margin:0 0 16px;
  }
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 15px;border-radius:14px;cursor:pointer;font-family:inherit;
    background:rgba(30,41,59,.88);
    border:1.6px solid rgba(148,163,184,.25);
    color:#e2e8f0;font-size:14.5px;line-height:1.35;
    transition:transform .16s ease, background .16s ease, border-color .16s ease;
  }
  .opt:hover:not(:disabled){transform:translateX(5px);border-color:#38bdf8;background:rgba(56,189,248,.14)}
  .opt:disabled{cursor:default}
  .opt .letter{
    flex:0 0 28px;width:28px;height:28px;border-radius:50%;
    display:grid;place-items:center;font-weight:900;font-size:12.5px;
    background:#334155;color:#cbd5e1;transition:.16s;
  }
  .opt.correct{background:rgba(34,197,94,.22);border-color:#22c55e;color:#dcfce7}
  .opt.correct .letter{background:#22c55e;color:#052e16}
  .opt.wrong{background:rgba(239,68,68,.20);border-color:#ef4444;color:#fee2e2}
  .opt.wrong .letter{background:#ef4444;color:#450a0a}
  .opt.dim{opacity:.62}

  .feedback{
    margin-top:14px;padding:13px 15px;border-radius:14px;
    font-size:13.5px;line-height:1.6;border:1px solid;
    animation:popIn .3s ease;
  }
  .feedback.ok{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:#bbf7d0}
  .feedback.no{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.5);color:#fecaca}
  .feedback.info{background:rgba(56,189,248,.13);border-color:rgba(56,189,248,.5);color:#bae6fd}
  .feedback b{color:#fff}

  .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}

  /* ---------- BUTTONS ---------- */
  .btn{
    border:none;border-radius:13px;padding:11px 17px;font-family:inherit;
    font-weight:800;font-size:13.5px;cursor:pointer;letter-spacing:.3px;
    display:inline-flex;align-items:center;gap:7px;
    transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.40)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn-spin{background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#04121f}
  .btn-answer{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b1d00}
  .btn-menu{background:rgba(148,163,184,.16);color:#e2e8f0;border:1px solid rgba(148,163,184,.32)}

  .sound-btn{
    position:fixed;top:16px;right:16px;z-index:50;
    width:46px;height:46px;border-radius:50%;cursor:pointer;
    background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.35);
    color:#e2e8f0;font-size:20px;line-height:1;
    display:grid;place-items:center;backdrop-filter:blur(8px);
    transition:.18s;
  }
  .sound-btn:hover{transform:scale(1.08);border-color:#22d3ee}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:10px}
</style>
</head>
<body>

<button class="sound-btn" id="soundBtn" title="Hidup/Matikan Suara">🔊</button>

<div class="app">
  <header>
    <div class="pill">IPAS • Kelas 6 SD</div>
    <h1>Menjelajah Sistem Pencernaan Manusia</h1>
    <p class="author">Dibuat oleh <b>Dedy Nugroho, S.Pd.SD</b></p>
  </header>

  <main>
    <!-- ============ RODA PUTAR ============ -->
    <section class="wheel-panel">
      <div class="wheel-wrap">
        <canvas id="wheel"></canvas>
        <div class="pointer"></div>
        <button class="spin-btn" id="spinBtn"><span>PUTAR</span></button>
      </div>
      <p class="hint">Tekan tombol <b>PUTAR</b> di tengah roda untuk mendapatkan nomor soal</p>
    </section>

    <!-- ============ PANEL SOAL ============ -->
    <section class="card" id="panel"></section>
  </main>
</div>

<script>
/* =====================================================================
   1. DATA PERTANYAAN  (20 soal – Sistem Pencernaan Manusia)
   ===================================================================== */
const QUESTIONS = [
  { q:"Organ pertama yang dilalui makanan saat proses pencernaan dimulai adalah …",
    opts:["Mulut","Kerongkongan","Lambung","Usus halus"], a:0, img:"mulut",
    exp:"Pencernaan dimulai di mulut. Makanan dikunyah oleh gigi dan dicampur air liur agar mudah ditelan." },

  { q:"Enzim ptialin (amilase) yang terdapat dalam air liur berfungsi mengubah zat tepung menjadi …",
    opts:["Protein","Gula sederhana (maltosa)","Lemak","Vitamin"], a:1, img:"mulut",
    exp:"Enzim ptialin mengubah amilum (zat tepung) menjadi maltosa, yaitu gula sederhana." },

  { q:"Gerakan otot kerongkongan yang mendorong makanan menuju lambung disebut gerak …",
    opts:["Peristaltik","Refleks","Rotasi","Difusi"], a:0, img:"kerongkongan",
    exp:"Gerak peristaltik adalah gerakan meremas dan mendorong makanan di sepanjang saluran pencernaan." },

  { q:"Organ pencernaan berbentuk kantong yang menghasilkan asam klorida (HCl) adalah …",
    opts:["Usus besar","Lambung","Hati","Pankreas"], a:1, img:"lambung",
    exp:"Lambung menghasilkan asam klorida (HCl) dan enzim pepsin untuk mencerna makanan, terutama protein." },

  { q:"Fungsi utama asam klorida (HCl) di dalam lambung adalah …",
    opts:["Menyerap air","Membunuh kuman dan mengaktifkan pepsin","Menghasilkan empedu","Menyerap sari makanan"], a:1, img:"lambung",
    exp:"HCl membunuh bakteri yang masuk bersama makanan dan mengaktifkan pepsinogen menjadi pepsin." },

  { q:"Enzim pepsin yang dihasilkan lambung mengubah protein menjadi …",
    opts:["Pepton","Glukosa","Asam lemak","Maltosa"], a:0, img:"lambung",
    exp:"Pepsin memecah protein menjadi pepton, kemudian di usus halus diubah lagi menjadi asam amino." },

  { q:"Cairan empedu yang membantu mencerna lemak dihasilkan oleh organ …",
    opts:["Pankreas","Hati","Lambung","Ginjal"], a:1, img:"hati",
    exp:"Empedu diproduksi oleh hati, disimpan di kantong empedu, lalu dialirkan ke usus halus untuk mengemulsikan lemak." },

  { q:"Organ yang menghasilkan enzim tripsin, amilase, dan lipase adalah …",
    opts:["Hati","Pankreas","Usus besar","Kerongkongan"], a:1, img:"pankreas",
    exp:"Pankreas menghasilkan getah pankreas yang mengandung tripsin, amilase, dan lipase." },

  { q:"Penyerapan sari-sari makanan terjadi di dalam usus halus, tepatnya pada bagian …",
    opts:["Jonjot usus (vili)","Dinding lambung","Usus besar","Rektum"], a:0, img:"vili",
    exp:"Di permukaan usus halus terdapat jonjot usus (vili) yang memperluas bidang penyerapan sari makanan." },

  { q:"Enzim lipase berfungsi mengubah lemak menjadi …",
    opts:["Asam amino","Asam lemak dan gliserol","Glukosa","Pepton"], a:1, img:"pankreas",
    exp:"Lipase memecah lemak menjadi asam lemak dan gliserol agar dapat diserap oleh tubuh." },

  { q:"Fungsi utama usus besar dalam sistem pencernaan adalah …",
    opts:["Menyerap air dan garam mineral","Menyerap sari makanan","Menghasilkan enzim","Membunuh kuman"], a:0, img:"ususbesar",
    exp:"Usus besar menyerap air dan garam mineral serta membusukkan sisa makanan dengan bantuan bakteri." },

  { q:"Bakteri Escherichia coli yang membantu pembusukan sisa makanan hidup di …",
    opts:["Mulut","Lambung","Usus besar","Kerongkongan"], a:2, img:"bakteri",
    exp:"E. coli hidup di usus besar, membantu membusukkan sisa makanan, dan menghasilkan vitamin K." },

  { q:"Urutan saluran pencernaan manusia yang benar adalah …",
    opts:["Mulut – lambung – kerongkongan – usus halus – usus besar – anus",
          "Mulut – kerongkongan – lambung – usus halus – usus besar – anus",
          "Mulut – kerongkongan – usus halus – lambung – usus besar – anus",
          "Mulut – lambung – usus halus – kerongkongan – usus besar – anus"], a:1, img:"urutan",
    exp:"Makanan melewati: mulut → kerongkongan → lambung → usus halus → usus besar → anus." },

  { q:"Gigi yang berfungsi untuk merobek makanan adalah …",
    opts:["Gigi seri","Gigi taring","Gigi geraham","Gigi susu"], a:1, img:"gigi",
    exp:"Gigi taring berbentuk runcing dan berfungsi untuk merobek makanan." },

  { q:"Proses pengeluaran sisa makanan yang tidak tercerna melalui anus disebut …",
    opts:["Defekasi","Deglutisi","Ingesti","Absorpsi"], a:0, img:"anus",
    exp:"Defekasi adalah proses pengeluaran feses (sisa makanan) melalui anus." },

  { q:"Sembelit (konstipasi) sering terjadi karena …",
    opts:["Kekurangan air dan serat","Kelebihan protein","Kekurangan vitamin C","Terlalu banyak minum air"], a:0, img:"air",
    exp:"Kurang makan makanan berserat dan kurang minum air membuat feses keras sehingga sulit dikeluarkan." },

  { q:"Jumlah gigi susu pada anak-anak adalah …",
    opts:["20 buah","28 buah","32 buah","24 buah"], a:0, img:"gigi",
    exp:"Gigi susu anak-anak berjumlah 20 buah, sedangkan orang dewasa memiliki 32 gigi tetap." },

  { q:"Makanan umumnya berada di dalam lambung selama …",
    opts:["2–4 jam","10 menit","12 jam","24 jam"], a:0, img:"lambung",
    exp:"Makanan bertahan di lambung sekitar 2–4 jam sebelum diteruskan ke usus halus." },

  { q:"Proses masuknya makanan ke dalam tubuh disebut …",
    opts:["Ingesti (makan)","Digesti","Absorpsi","Defekasi"], a:0, img:"mulut",
    exp:"Ingesti adalah proses memasukkan makanan ke dalam mulut, yaitu awal dari pencernaan." },

  { q:"Zat gizi yang tidak perlu dicerna lagi karena dapat langsung diserap adalah …",
    opts:["Vitamin dan mineral","Protein","Lemak","Karbohidrat"], a:0, img:"vili",
    exp:"Vitamin, mineral, dan air tidak memerlukan pencernaan kimiawi sehingga langsung diserap di usus halus." }
];

   2. ILUSTRASI SVG

  vili: `<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">

/* =====================================================================
   3. AUDIO (Web Audio API – tanpa file eksternal)
   ===================================================================== */
let actx = null, master = null, muted = false;

function initAudio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.55;
    master.connect(actx.destination);
  }
  if(actx.state === 'suspended') actx.resume();
}

function tone(freq, dur, type='sine', vol=0.2, delay=0){
  if(!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.06);
}

function playTick(){
  if(!actx || muted) return;
  tone(1500 + Math.random()*350, 0.045, 'square', 0.055);
}

function playSpinSound(){
  if(!actx || muted) return;
  const dur = 1.8, now = actx.currentTime;
  const buf = actx.createBuffer(1, Math.floor(actx.sampleRate*dur), actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * 0.6;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='bandpass'; f.Q.value = 1.3;
  f.frequency.setValueAtTime(280, now);
  f.frequency.exponentialRampToValueAtTime(2600, now + 0.45);
  f.frequency.exponentialRampToValueAtTime(420, now + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(0.30, now + 0.14);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(f).connect(g).connect(master);
  src.start(now);
}

function playBoom(){
  if(!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.55);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.55, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 1.0);
}

function playFanfare(){
  if(!actx || muted) return;
  playBoom();
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((n,i)=> tone(n, 0.42, 'triangle', 0.20, 0.06 + i*0.11));
  tone(1318.5, 0.7, 'triangle', 0.16, 0.52);
}

function playCorrect(){
  if(!actx || muted) return;
  [659.25, 830.61, 987.77, 1318.5].forEach((n,i)=> tone(n, 0.30, 'triangle', 0.22, i*0.085));
}

function playWrong(){
  if(!actx || muted) return;
  tone(233.08, 0.28, 'sawtooth', 0.16, 0);
  tone(174.61, 0.45, 'sawtooth', 0.16, 0.16);
}

/* =====================================================================
   4. RODA PUTAR (Canvas)
   ===================================================================== */
const canvas  = document.getElementById('wheel');
const ctx     = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');

const N = 20;
const SEG = Math.PI * 2 / N;
const W = 600;                    // ukuran logis canvas
const COLORS = ['#0ea5e9','#8b5cf6','#ec4899','#f59e0b','#10b981',
                '#3b82f6','#f43f5e','#14b8a6','#a855f7','#f97316'];

let rot = 0;            // sudut rotasi roda (radian)
let spinning = false;
let highlight = -1;     // segmen pemenang
let lastIdx = -1;

function setupCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * dpr;
  canvas.height = W * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawWheel(){
  const cx = W/2, cy = W/2, R = W/2 - 16;
  ctx.clearRect(0, 0, W, W);

  /* cincin luar */
  ctx.beginPath();
  ctx.arc(cx, cy, R + 9, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(2,6,23,.92)';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(34,211,238,.55)';
  ctx.stroke();

  /* segmen */
  for(let i = 0; i < N; i++){
    const a0 = i*SEG + rot;
    const a1 = a0 + SEG;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath();

    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    if(i === highlight){
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      ctx.fill();
    }

    ctx.lineWidth  = (i === highlight) ? 5 : 2;
    ctx.strokeStyle = (i === highlight) ? '#ffffff' : 'rgba(255,255,255,.45)';
    ctx.stroke();

    /* nomor soal */
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a0 + SEG/2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.round(W*0.062) + 'px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    ctx.fillText(String(i+1), R - 24, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(i+1), R - 26, 0);
    ctx.restore();
  }

  /* lingkaran tengah */
  ctx.beginPath();
  ctx.arc(cx, cy, W*0.145, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(2,6,23,.95)';
  ctx.fill();
}

function indexAtPointer(){
  const twoPi = Math.PI*2;
  const a = (((-Math.PI/2 - rot) % twoPi) + twoPi) % twoPi;
  return Math.floor(a / SEG) % N;
}

/* =====================================================================
   5. LOGIKA PUTARAN
   ===================================================================== */
function spin(){
  if(spinning) return;
  initAudio();
  spinning = true;
  highlight = -1;
  spinBtn.disabled = true;
  showSpinningView();
  playSpinSound();

  /* pilih nomor tujuan (hindari nomor yang sama dua kali berturut-turut) */
  let target = Math.floor(Math.random() * N);
  if(target === lastIdx) target = (target + 7) % N;
  lastIdx = target;

  const twoPi = Math.PI*2;
  const targetAngle = -Math.PI/2 - (target + 0.5) * SEG;
  const turns  = 6 + Math.floor(Math.random()*3);
  const k      = Math.ceil((rot + turns*twoPi - targetAngle) / twoPi);
  const finalRot = targetAngle + k*twoPi;

  const startRot = rot;
  const total    = finalRot - startRot;
  const dur      = 4600;
  const t0       = performance.now();

  let lastTickIdx  = indexAtPointer();
  let lastTickTime = 0;

  function frame(t){
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);      // ease-out cubic
    rot = startRot + total * e;
    drawWheel();

    const idx = indexAtPointer();
    if(idx !== lastTickIdx){
      lastTickIdx = idx;
      if(t - lastTickTime > 45){ lastTickTime = t; playTick(); }
    }

    if(p < 1){
      requestAnimationFrame(frame);
    } else {
      rot = ((rot % twoPi) + twoPi) % twoPi;   // normalisasi
      spinning  = false;
      highlight = target;
      drawWheel();
      spinBtn.disabled = false;
      playFanfare();
      setTimeout(() => renderQuestion(target), 600);
    }
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   6. PANEL SOAL
   ===================================================================== */
const panel = document.getElementById('panel');
let currentIdx = -1;
let answered   = false;
const score = { benar: 0, salah: 0 };

      <p class="muted">Putar roda untuk mendapatkan nomor soal. Setiap nomor berisi satu pertanyaan tentang
        <b>Sistem Pencernaan Manusia</b>.</p>
      <ul class="tips">
        <li>🎯 Tekan tombol <b>PUTAR</b> di tengah roda.</li>
        <li>❓ Baca pertanyaan, lalu pilih satu jawaban yang paling tepat.</li>
        <li>💡 Bingung? Gunakan tombol <b>Lihat Jawaban</b>.</li>
        <li>🔄 Tekan <b>Putar Ulang</b> untuk mendapatkan soal berikutnya.</li>
        <li>🏠 Tekan <b>Kembali ke Menu</b> untuk memulai dari awal.</li>
      </ul>
      <div class="stats-row">
        <div class="stat ok">✅ Benar: ${score.benar}</div>
        <div class="stat no">❌ Salah: ${score.salah}</div>
      </div>
      <button class="btn btn-spin" id="startBtn" style="margin-top:14px">▶ Mulai Bermain</button>
    </div>`;

  document.getElementById('startBtn').onclick = () => {
    initAudio();
    tone(660, 0.15, 'triangle', 0.18);
    spin();
  };
}

function showSpinningView(){
  panel.innerHTML = `
    <div class="spinning-view">
      <div class="loader"></div>
      <h2>Roda sedang berputar…</h2>
      <p class="muted" style="color:#94a3b8;font-size:14px;margin:0">
        Semoga nomor soalnya mudah, ya! 🤞
      </p>
    </div>`;
}

function renderQuestion(idx){
  currentIdx = idx;
  answered   = false;
  const q = QUESTIONS[idx];

  panel.innerHTML = `
    <div class="q-head">
      <span class="badge">SOAL ${idx + 1}</span>
      <span class="score-chip">✅ ${score.benar} &nbsp; ❌ ${score.salah}</span>
    </div>
    <div class="illus">${ILLUS[q.img]}</div>
    <h2 class="q-text">${q.q}</h2>
    <div class="options" id="options">
      ${q.opts.map((o, i) => `
        <button class="opt" data-i="${i}">
          <span class="letter">${'ABCD'[i]}</span>
          <span>${o}</span>
        </button>`).join('')}
    </div>
    <div id="feedbackSlot"></div>
    <div class="actions">
      <button class="btn btn-spin"   id="respin">🔄 Putar Ulang</button>
      <button class="btn btn-answer" id="showAns">💡 Lihat Jawaban</button>
      <button class="btn btn-menu"   id="toMenu">🏠 Kembali ke Menu</button>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => selectOption(parseInt(btn.dataset.i, 10));
  });
  document.getElementById('respin').onclick  = () => spin();
  document.getElementById('showAns').onclick = () => revealAnswer();
  document.getElementById('toMenu').onclick  = () => { renderMenu(); tone(520,0.12,'triangle',0.15); };
}

function updateScoreChip(){
  const el = panel.querySelector('.score-chip');
  if(el) el.innerHTML = `✅ ${score.benar} &nbsp; ❌ ${score.salah}`;
}

function showFeedback(type, q, chosen){
  const slot = document.getElementById('feedbackSlot');
  if(!slot) return;

  let cls, title;
  if(type === 'ok'){ cls = 'ok'; title = '🎉 Hebat! Jawabanmu benar.'; }
  else if(type === 'no'){ cls = 'no'; title = '❌ Belum tepat.'; }
  else { cls = 'info'; title = '💡 Kunci Jawaban'; }

  const kunci = `${'ABCD'[q.a]}. ${q.opts[q.a]}`;

  slot.innerHTML = `
    <div class="feedback ${cls}">
      <b>${title}</b><br>
      ${type === 'info' ? '' : (type === 'no' ? `Jawaban yang benar: <b>${kunci}</b><br>` : '')}
      <span style="opacity:.92">${q.exp}</span>
    </div>`;
}

function selectOption(i){
  if(answered) return;
  answered = true;

  const q = QUESTIONS[currentIdx];
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add('correct');

  if(i === q.a){
    score.benar++;
    playCorrect();
    showFeedback('ok', q);
  } else {
    btns[i].classList.add('wrong');
    score.salah++;
    playWrong();
    showFeedback('no', q);
  }
  updateScoreChip();
}

function revealAnswer(){
  if(answered) return;
  answered = true;

  const q = QUESTIONS[currentIdx];
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach((b, i) => {
    b.disabled = true;
    if(i !== q.a) b.classList.add('dim');
  });
  btns[q.a].classList.add('correct');

  tone(880, 0.18, 'triangle', 0.16);
  showFeedback('info', q);
}

drawWheel();

spinBtn.onclick = () => spin();

/* tombol suara */

soundBtn.onclick = () => {
  muted = !muted;
  soundBtn.textContent = muted ? '🔇' : '🔊';
  if(!muted){ initAudio(); tone(700, 0.12, 'triangle', 0.18); }
};

/* shortcut: tekan spasi untuk memutar */
document.addEventListener('keydown', e => {
  if(e.code === 'Space' && document.activeElement.tagName !== 'BUTTON'){
    e.preventDefault();
    if(!spinning) spin();
  }
});
